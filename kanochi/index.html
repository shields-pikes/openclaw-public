<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>完落ち 取調室三章</title>
<meta name="description" content="取調室で被疑者を追い詰める、写真で描く推理アドベンチャー。全三章。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=Shippori+Mincho+B1:wght@500;700;800&display=swap">
<style>
/* Layout: a dim interrogation room. The photo is the window across the steel table;
   the case file (manila folder) lies to the right, the command tabs along the table edge. */
:root {
  color-scheme: dark;
  --room: #0d1011;
  --room-2: #151a1b;
  --room-3: #1d2324;
  --steel: #7e8b8d;
  --steel-dim: #39444a;
  --line: #2b3436;
  --paper: #e8e2d2;
  --paper-2: #d9d1bd;
  --ink: #26221d;
  --ink-dim: #6b6255;
  --manila: #c7a76a;
  --manila-dark: #8d7444;
  --lamp: #f0b54a;
  --seal: #b5302a;
  --chill: #93b6c2;
  --text: #ddd6c6;
  --text-dim: #958f83;
  --good: #c9b56b;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --font-body: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --font-ui: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "YuGothic", system-ui, sans-serif;
  --r: 3px;
  --gap: 12px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--room); color: var(--text);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* ───────── app frame ───────── */
.app { height: 100%; display: flex; flex-direction: column; position: relative; isolation: isolate; }
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 8px 16px;
  padding-top: calc(8px + var(--sat));
  border-bottom: 1px solid var(--line); background: linear-gradient(#111516, #0d1011);
  min-height: 44px; flex: none;
}
.topbar .chap { font-family: var(--font-display); font-weight: 700; letter-spacing: .12em; color: var(--paper); white-space: nowrap; }
.topbar .case { color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.clock { font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.clock b { font-family: var(--font-display); font-size: 20px; color: var(--paper); letter-spacing: .04em; }
.clock small { color: var(--text-dim); font-size: 11px; }
.clock.urgent b { color: var(--lamp); }
.iconbtn {
  background: none; border: 1px solid var(--line); border-radius: var(--r); height: 30px; min-width: 30px; padding: 0 8px;
  color: var(--text-dim); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; flex: none;
}
.iconbtn:hover { color: var(--paper); border-color: var(--steel-dim); }

.room {
  flex: 1; min-height: 0; display: grid; gap: var(--gap); padding: var(--gap) 16px;
  padding-bottom: calc(var(--gap) + var(--sab));
  grid-template-columns: minmax(0, 1fr) clamp(320px, 31vw, 430px);
  grid-template-areas:
    "stage meters"
    "stage panel"
    "dialog panel"
    "cmd panel";
  grid-template-rows: auto minmax(0, 1fr) auto auto;
}
.stage { grid-area: stage; min-height: 0; position: relative; container-type: size; }
.meters { grid-area: meters; }
.panel { grid-area: panel; min-height: 0; }
.dialogue { grid-area: dialog; }
.commands { grid-area: cmd; }

/* ───────── stage / photo ───────── */
.stage-fill { position: absolute; inset: 0; overflow: hidden; border-radius: var(--r); background: #050606; }
.stage-fill img { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(28px) brightness(.32) saturate(.7); opacity: .9; transition: opacity .6s; }
.photo {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(100%, calc(100vh - 360px)); width: min(100cqw, 100cqh); aspect-ratio: 1; overflow: hidden; background: #070808;
  box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
}
.photo .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .32s ease; }
.photo .shot.on { opacity: 1; }
.photo .drift { position: absolute; inset: 0; animation: drift 26s ease-in-out infinite alternate; transform-origin: 50% 40%; }
@keyframes drift { from { transform: scale(1.0) translate(0, 0); } to { transform: scale(1.045) translate(-.6%, .4%); } }
.photo.tense .drift { animation-duration: 9s; }
.photo .insert { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.06); z-index: 3; pointer-events: none; }
.photo .insert.on { opacity: 1; transform: scale(1); transition: transform 1.4s cubic-bezier(.2,.7,.2,1); }
.photo .insert.evidence { box-shadow: inset 0 0 0 10px rgba(0,0,0,.4); }
.photo .ev-tag {
  position: absolute; left: 12px; top: 12px; z-index: 4; background: rgba(10,10,10,.72); color: var(--paper);
  font-size: 12px; padding: 4px 10px; letter-spacing: .08em; border-left: 3px solid var(--manila); opacity: 0; transition: opacity .2s;
  max-width: calc(100% - 24px);
}
.photo .ev-tag.on { opacity: 1; }
.grain { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; z-index: 5; pointer-events: none; mix-blend-mode: overlay; opacity: .11; background-size: 170px 170px; animation: grain .9s steps(6) infinite; }
@keyframes grain { 0% { transform: translate(0,0); } 17% { transform: translate(-7%,4%); } 33% { transform: translate(5%,-8%); } 50% { transform: translate(-3%,6%); } 67% { transform: translate(8%,2%); } 83% { transform: translate(-5%,-4%); } 100% { transform: translate(2%,3%); } }
.vignette { position: absolute; inset: 0; z-index: 6; pointer-events: none;
  background: radial-gradient(120% 95% at 50% 42%, transparent 45%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.85) 100%); }
.photo.tense .vignette { animation: pulse-v 1.1s ease-in-out infinite; }
@keyframes pulse-v { 0%,100% { box-shadow: inset 0 0 0 rgba(120,10,10,0); } 50% { box-shadow: inset 0 0 120px rgba(120,10,10,.35); } }
.flicker { position: absolute; inset: 0; z-index: 7; pointer-events: none; background: #000; opacity: 0; }
.flicker.go { animation: flick .42s steps(4) 1; }
@keyframes flick { 0% { opacity: 0; } 25% { opacity: .22; } 50% { opacity: .05; } 75% { opacity: .16; } 100% { opacity: 0; } }
.lampglow { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(70% 70% at 8% 45%, rgba(255,214,140,.85), rgba(255,170,70,.35) 40%, transparent 70%); transition: opacity .5s; }
.lampglow.on { opacity: 1; transition: opacity .08s; }
.photo.overexpose .shot.on { filter: brightness(1.28) contrast(1.15) saturate(.9); transition: filter .1s; }
.glare { position: absolute; z-index: 8; pointer-events: none; left: 34%; top: 26%; width: 70%; aspect-ratio: 1; transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255,250,235,.85) 0%, rgba(255,238,200,.35) 18%, rgba(255,230,180,.08) 42%, transparent 62%); mix-blend-mode: screen; opacity: 0; transition: opacity .6s; animation: glare 3.2s ease-in-out infinite; }
.glare.on { opacity: 1; }
@keyframes glare { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.06); } }
.flash { position: absolute; inset: 0; z-index: 12; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .7s ease-out 1; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
.photo.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97) 1; }
@keyframes shake { 10%, 90% { transform: translate(calc(-50% - 2px), -50%); } 20%, 80% { transform: translate(calc(-50% + 5px), calc(-50% + 2px)); } 30%, 50%, 70% { transform: translate(calc(-50% - 9px), calc(-50% - 2px)); } 40%, 60% { transform: translate(calc(-50% + 9px), calc(-50% + 1px)); } }
.photo.push .drift { animation: push 1.6s cubic-bezier(.2,.8,.2,1) 1 forwards; }
@keyframes push { from { transform: scale(1.0); } to { transform: scale(1.12); } }

.stamp {
  position: absolute; left: 50%; top: 46%; z-index: 10; pointer-events: none; opacity: 0;
  transform: translate(-50%, -50%) rotate(-9deg) scale(1.8);
  font-family: var(--font-display); font-weight: 800; letter-spacing: .08em; white-space: nowrap;
  border: .12em solid currentColor; padding: .02em .28em .06em; border-radius: .12em; line-height: 1.15;
}
.stamp.contra { color: rgba(197, 40, 33, .92); font-size: clamp(64px, 22cqmin, 150px); text-shadow: 0 0 1px rgba(197,40,33,.6);
  -webkit-mask-image: radial-gradient(circle at 30% 40%, #000 55%, rgba(0,0,0,.75) 75%, #000 100%); }
.stamp.nocontra { color: rgba(150, 176, 190, .9); font-size: clamp(34px, 11cqmin, 74px); }
.stamp.go { animation: stamp 1.5s cubic-bezier(.2,.9,.25,1) 1 forwards; }
@keyframes stamp {
  0% { opacity: 0; transform: translate(-50%,-50%) rotate(-9deg) scale(1.9); }
  12% { opacity: 1; transform: translate(-50%,-50%) rotate(-9deg) scale(.96); }
  18% { transform: translate(-50%,-50%) rotate(-9deg) scale(1.02); }
  24% { transform: translate(-50%,-50%) rotate(-9deg) scale(1); }
  78% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%,-50%) rotate(-9deg) scale(1); }
}
.ncrail { position: absolute; right: 10px; top: 12px; bottom: 12px; z-index: 9; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
.ncrail span { font-family: var(--font-display); font-weight: 800; font-size: 14px; color: #b3cbd6; border: 2px solid currentColor; padding: 1px 7px; transform: rotate(-6deg); background: rgba(8,12,14,.72); box-shadow: 0 4px 12px rgba(0,0,0,.5); animation: nc-in .5s ease-out; }
.ncrail span:nth-child(even) { transform: rotate(4deg); }
@keyframes nc-in { from { opacity: 0; transform: scale(1.6) rotate(-6deg); } }
.pov-label { position: absolute; left: 12px; bottom: 12px; z-index: 9; font-size: 11px; letter-spacing: .2em; color: rgba(255,240,210,.75); background: rgba(0,0,0,.45); padding: 3px 8px; opacity: 0; transition: opacity .6s; }
.pov-label.on { opacity: 1; }

/* ───────── meters ───────── */
.meters { background: var(--room-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 10px; display: grid; gap: 10px; }
.who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.who .nm { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--paper); letter-spacing: .06em; }
.who .meta { color: var(--text-dim); font-size: 12px; }
.who .type { margin-left: auto; font-size: 11px; color: var(--room); background: var(--manila); padding: 1px 8px; border-radius: 2px; letter-spacing: .1em; font-weight: 700; }
.who .type.unknown { background: var(--steel-dim); color: var(--paper); }
.who .type.innocent { background: var(--chill); }
.gauge { position: relative; display: grid; gap: 3px; }
.gauge .gh { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.gauge .lb { font-size: 12px; color: var(--text-dim); letter-spacing: .08em; }
.gauge .num { font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; color: var(--paper); min-width: 2.5em; }
.track { position: relative; height: 12px; background: #0a0d0e; border: 1px solid var(--steel-dim); border-radius: 1px; overflow: visible; }
.cap { position: relative; height: 13px; font-size: 10px; line-height: 13px; letter-spacing: .04em; }
.cap .mk { position: absolute; top: 0; transform: translateX(-50%); color: #e5806f; white-space: nowrap; }
.cap .mk.honest { color: var(--good); }
.cap .end { position: absolute; top: 0; color: var(--text-dim); }
.cap .end.l { left: 0; } .cap .end.r { right: 0; }
.track .ticks { position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.13) 0 1px, transparent 1px 10%); background-size: 100% 4px; background-repeat: no-repeat; background-position: bottom; pointer-events: none; }
.track .void { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(126,139,141,.28) 0 2px, transparent 2px 6px); }
.track .fill { position: absolute; top: 2px; bottom: 2px; transition: left .7s cubic-bezier(.2,.8,.2,1), width .7s cubic-bezier(.2,.8,.2,1), background .7s; }
.track .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--seal); transform: translateX(-1px); box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.track .mark.honest { background: var(--good); }
.track .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: rgba(255,255,255,.35); }
.gauge.d .fill { left: 0; background: linear-gradient(90deg, #5b6b70, #c98b3c 70%, #d8452f); background-size: var(--bgw, 100%) 100%; }
.gauge.k .fill.neg { background: linear-gradient(270deg, #7a3a33, #b5302a); }
.gauge.k .fill.pos { background: linear-gradient(90deg, #6f7a54, var(--good)); }
.gauge.hot .track { box-shadow: 0 0 0 1px rgba(216,69,47,.6), 0 0 14px rgba(216,69,47,.35); }
.gauge.max .num { color: var(--lamp); }
.chip { font-size: 10px; letter-spacing: .08em; padding: 0 6px; border-radius: 2px; border: 1px solid currentColor; white-space: nowrap; }
.pop { position: absolute; right: 3.2em; top: -2px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; pointer-events: none; animation: pop 1.6s ease-out forwards; text-shadow: 0 1px 2px #000; }
.pop.up { color: #f08a6a; } .pop.down { color: #9cc7d6; } .pop.kup { color: var(--good); } .pop.kdown { color: #e0675c; }
@keyframes pop { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: translateY(-4px); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px); } }
.conds { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--text-dim); border-top: 1px dashed var(--line); padding-top: 8px; }
.conds .stm { display: inline-flex; gap: 3px; align-items: center; }
.conds .stm i { width: 9px; height: 12px; border: 1px solid var(--steel-dim); background: transparent; display: inline-block; }
.conds .stm i.on { background: var(--paper); border-color: var(--paper); }
.conds .ok { color: var(--lamp); }
.conds .sep { opacity: .4; }

/* ───────── dialogue ───────── */
.dialogue {
  position: relative; background: rgba(10,12,13,.94); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 16px 14px; min-height: 112px; cursor: pointer; user-select: none;
}
.dialogue .spk { font-size: 12px; letter-spacing: .14em; color: var(--text-dim); height: 18px; display: flex; gap: 8px; align-items: center; }
.dialogue .spk b { font-family: var(--font-display); font-weight: 700; color: var(--paper); font-size: 14px; letter-spacing: .1em; }
.dialogue[data-s="k"] .spk b { color: var(--lamp); }
.dialogue[data-s="s"] .spk b { color: var(--chill); }
.dialogue .txt { font-family: var(--font-body); font-size: 17px; line-height: 1.85; color: var(--paper); margin: 4px 0 0; min-height: 3.6em; text-wrap: pretty; }
.dialogue[data-s="n"] .txt { color: #c9c2b1; }
.dialogue[data-s="m"] .txt { color: #e9c98c; font-style: normal; }
.dialogue[data-s="sys"] .txt { font-family: var(--font-ui); font-size: 14px; color: var(--manila); letter-spacing: .04em; }
.dialogue .nxt { position: absolute; right: 14px; bottom: 8px; font-size: 12px; color: var(--lamp); opacity: 0; }
.dialogue.done .nxt { opacity: 1; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.dialogue.idle { cursor: default; }
.dialogue .skip { position: absolute; right: 10px; top: 8px; background: none; border: 1px solid var(--line); color: var(--text-dim); font-size: 11px; padding: 1px 8px; border-radius: 2px; cursor: pointer; letter-spacing: .08em; }
.dialogue .skip:hover { color: var(--paper); border-color: var(--steel-dim); }
.dialogue.idle .skip { display: none; }
.dialogue.idle .txt { color: var(--text-dim); font-size: 15px; }

/* ───────── commands ───────── */
.commands { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cmd {
  position: relative; background: linear-gradient(#d3b77c, var(--manila)); color: #241b0c; border: 0; border-radius: 6px 6px 2px 2px;
  padding: 10px 6px 9px; cursor: pointer; font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .14em;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), 0 2px 0 #5d4a26; transition: transform .12s, filter .2s;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.cmd small { font-family: var(--font-ui); font-weight: 400; font-size: 10px; letter-spacing: .05em; opacity: .72; }
.cmd:hover { filter: brightness(1.07); }
.cmd:active { transform: translateY(1px); }
.cmd.active { background: linear-gradient(#f0dcae, #dcc08a); box-shadow: inset 0 -2px 0 rgba(0,0,0,.1), 0 0 0 2px var(--lamp); }
.cmd:disabled { filter: saturate(.5) brightness(.72); cursor: default; }
.cmd .badge { position: absolute; top: -6px; right: -4px; background: var(--seal); color: #fff; font-family: var(--font-ui); font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 9px; letter-spacing: 0; line-height: 18px; }
.responses { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.resp {
  background: #1b2224; border: 1px solid #3c494c; color: var(--paper); border-radius: var(--r); cursor: pointer;
  padding: 10px 4px 8px; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .06em; line-height: 1.3;
  display: flex; flex-direction: column; align-items: center; gap: 2px; transition: background .2s, border-color .2s;
}
.resp small { font-family: var(--font-ui); font-weight: 400; font-size: 10px; color: var(--text-dim); letter-spacing: 0; }
.resp:hover { background: #243033; border-color: var(--steel); }
.resp.confess { border-color: #6d2a25; background: #2a1514; }
.resp.confess:hover { background: #3a1a18; border-color: var(--seal); }
.resp:disabled { opacity: .35; cursor: not-allowed; }
.resp .s { display: none; }

/* ───────── panel (case file) ───────── */
.panel { background: var(--room-2); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; }
.panel-head { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px 8px; border-bottom: 1px solid var(--line); background: linear-gradient(#1a2021, #151a1b); }
.panel-head h2 { margin: 0; font-family: var(--font-display); font-size: 16px; letter-spacing: .14em; color: var(--paper); font-weight: 700; }
.panel-head .sub { font-size: 11px; color: var(--text-dim); }
.panel-head .x { margin-left: auto; }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px 16px; display: grid; gap: 12px; align-content: start; overscroll-behavior: contain; }
.sect-title { font-size: 11px; letter-spacing: .2em; color: var(--text-dim); display: flex; align-items: center; gap: 8px; margin: 2px 0 -4px; }
.sect-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.hint { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
.hint.lamp { color: var(--lamp); }

.topics { display: grid; gap: 6px; }
.topic {
  text-align: left; background: #1d2426; border: 1px solid #334043; border-radius: var(--r); padding: 9px 12px; cursor: pointer;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; transition: border-color .2s, background .2s;
}
.topic:hover { border-color: var(--steel); background: #222b2d; }
.topic .tl { font-family: var(--font-display); font-weight: 700; color: var(--paper); font-size: 14px; letter-spacing: .04em; }
.topic .st { font-size: 10px; letter-spacing: .1em; color: var(--text-dim); border: 1px solid var(--line); padding: 0 6px; border-radius: 2px; }
.topic .st.new { color: var(--lamp); border-color: rgba(240,181,74,.5); }
.topic .st.honest { color: var(--good); border-color: rgba(201,181,107,.5); }
.topic:disabled { opacity: .45; cursor: not-allowed; }

.cards { display: grid; gap: 8px; }
.card {
  position: relative; text-align: left; background: var(--paper); color: var(--ink); border-radius: 2px; padding: 10px 12px 10px 14px;
  box-shadow: 0 1px 0 rgba(0,0,0,.4), 0 6px 14px rgba(0,0,0,.25); border: 0; width: 100%;
  background-image: repeating-linear-gradient(transparent 0 23px, rgba(80,110,140,.16) 23px 24px); background-position: 0 6px;
}
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: rgba(181,48,42,.38); }
.card .ct { font-family: var(--font-ui); font-size: 11px; letter-spacing: .08em; color: var(--ink-dim); display: flex; gap: 6px; align-items: center; }

.facts { display: grid; gap: 8px; }

  background: #e2d3ab; color: #2a2214; border: 0; border-radius: 2px; padding: 8px; box-shadow: 0 1px 0 rgba(0,0,0,.4), 0 6px 14px rgba(0,0,0,.22); width: 100%;
}

.pairbar { position: sticky; bottom: -16px; background: rgba(13,16,17,.97); border: 1px solid var(--lamp); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; margin: 0 -2px; }
.pairbar p { margin: 0; font-size: 12px; color: var(--text); line-height: 1.6; }

.pairbar .btn { white-space: nowrap; padding: 8px 12px; font-size: 13px; letter-spacing: .06em; }
.btn {
  border-radius: var(--r); border: 1px solid var(--steel-dim); background: #1e2628; color: var(--paper); padding: 8px 14px; cursor: pointer;
  font-family: var(--font-display); font-weight: 700; letter-spacing: .1em; font-size: 14px;
}

.shakes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  text-align: left; background: #1d2426; border: 1px solid #334043; border-radius: var(--r); padding: 9px 11px; cursor: pointer;

/* 供述調書（縦書き） */
.record-wrap { background: var(--paper); color: var(--ink); border-radius: 2px; box-shadow: 0 8px 24px rgba(0,0,0,.4); overflow-x: auto; overflow-y: hidden; }
.record {

/* ───────── overlay screens ───────── */
.overlay { position: absolute; inset: 0; z-index: 50; display: grid; overflow: auto; background: rgba(5,6,6,.86); backdrop-filter: blur(3px); }
.overlay.solid { background: #050606; backdrop-filter: none; }
.screen { position: relative; min-height: 100%; display: grid; }
.title-screen { place-items: stretch; }
.title-bg { position: absolute; inset: 0; overflow: hidden; }

@keyframes titledrift { from { transform: scale(1.02); } to { transform: scale(1.1) translate(-1.5%, 1%); } }
.title-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,6,6,.92) 0%, rgba(5,6,6,.55) 45%, rgba(5,6,6,.2) 70%, rgba(5,6,6,.6) 100%), radial-gradient(120% 90% at 70% 40%, transparent 40%, rgba(0,0,0,.7)); }
.title-inner { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; padding: clamp(24px, 6vw, 72px) clamp(16px, 6vw, 80px); padding-top: calc(clamp(24px, 6vw, 72px) + var(--sat)); align-items: end; }
.title-word {
  writing-mode: vertical-rl; font-family: var(--font-display); font-weight: 800; color: var(--paper); line-height: 1;
  font-size: clamp(88px, 17vh, 168px); letter-spacing: .06em; text-shadow: 0 6px 40px rgba(0,0,0,.6); margin: 0; align-self: start; justify-self: end;
  grid-column: 2; grid-row: 1 / span 2;
}
.title-word small { font-size: .17em; letter-spacing: .5em; font-weight: 700; color: var(--manila); margin-top: .8em; display: inline-block; }
.title-copy { grid-column: 1; grid-row: 1; align-self: start; max-width: 30em; }

.title-copy .en { font-size: 11px; letter-spacing: .5em; color: var(--text-dim); }
.menu { grid-column: 1; grid-row: 2; display: grid; gap: 10px; justify-items: start; align-self: end; }
.menu .btn { min-width: 200px; text-align: left; font-size: 16px; padding: 11px 18px; background: rgba(20,24,25,.78); }
.menu .btn.lamp { background: var(--lamp); }
.menu .row { display: flex; gap: 8px; flex-wrap: wrap; }
.menu .note { font-size: 11px; color: var(--text-dim); max-width: 32em; line-height: 1.7; }

.card-screen { place-items: center; padding: 24px 16px; }
.chapter-card { position: relative; width: min(980px, 100%); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); background: #0b0d0e; border: 1px solid var(--line); box-shadow: 0 30px 90px rgba(0,0,0,.7); }
.chapter-card .pic { position: relative; min-height: 300px; overflow: hidden; }

.chapter-card .pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 50%, #0b0d0e), radial-gradient(100% 100% at 40% 50%, transparent 50%, rgba(0,0,0,.6)); }
.chapter-card .pic .vt { position: absolute; right: 18px; top: 22px; writing-mode: vertical-rl; font-family: var(--font-display); font-weight: 800; color: var(--paper); font-size: 40px; letter-spacing: .14em; z-index: 1; text-shadow: 0 4px 20px rgba(0,0,0,.8); }

.profile { display: grid; grid-template-columns: 76px 1fr; gap: 12px; background: var(--paper); color: var(--ink); padding: 10px; border-radius: 2px; }
.profile img { width: 76px; height: 92px; object-fit: cover; object-position: 50% 20%; filter: grayscale(.35) contrast(1.05); box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
.profile .pn { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: .08em; }
.profile .pn small { font-size: 11px; color: var(--ink-dim); font-weight: 500; margin-left: 6px; letter-spacing: .1em; }
.profile .pm { font-size: 12px; color: var(--ink-dim); }
.profile .pt { font-size: 12px; margin-top: 4px; line-height: 1.6; }
.profile .pt b { background: var(--ink); color: var(--paper); padding: 0 6px; margin-right: 6px; font-size: 11px; letter-spacing: .1em; }

.result { width: min(560px, 100%); background: var(--paper); color: var(--ink); padding: 26px 26px 22px; box-shadow: 0 30px 90px rgba(0,0,0,.7); position: relative; display: grid; gap: 14px; }
.result h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: .2em; }
.result .big-stamp { position: absolute; right: 22px; top: 18px; color: rgba(181,48,42,.9); border: 4px solid currentColor; font-family: var(--font-display); font-weight: 800; font-size: 34px; padding: 2px 12px; transform: rotate(-8deg); letter-spacing: .1em; }
.result dl { display: grid; grid-template-columns: 1fr auto; margin: 0; gap: 6px 12px; font-size: 14px; border-top: 1px solid rgba(0,0,0,.15); padding-top: 12px; }

.result dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.result .lead { font-family: var(--font-body); line-height: 1.9; margin: 0; }
.result .row { display: flex; gap: 8px; flex-wrap: wrap; }
.result .btn { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.result .btn.primary { background: var(--seal); border-color: #7b1e19; }

.doc-screen { place-items: center; padding: 24px 16px; }
.doc { width: min(920px, 100%); display: grid; gap: 12px; }
.doc .record { height: min(520px, 66vh); font-size: 16px; }
.doc .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--text-dim); font-size: 12px; }

.help { width: min(760px, 100%); background: var(--room-2); border: 1px solid var(--line); padding: 22px 24px; display: grid; gap: 14px; box-shadow: 0 30px 90px rgba(0,0,0,.7); }
.help h2 { margin: 0; font-family: var(--font-display); font-size: 22px; letter-spacing: .2em; color: var(--paper); }
.help h3 { margin: 6px 0 2px; font-family: var(--font-display); font-size: 15px; color: var(--manila); letter-spacing: .1em; }
.help p, .help li { font-family: var(--font-body); font-size: 14px; line-height: 1.85; color: #d2cbbb; margin: 0; }
.help ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.help .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.help kbd { font-family: var(--font-ui); font-size: 11px; border: 1px solid var(--steel-dim); padding: 0 5px; border-radius: 2px; color: var(--paper); }

.log { width: min(720px, 100%); max-height: 80vh; background: var(--room-2); border: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0,1fr); }
.log .panel-body { gap: 10px; }
.log .ln { font-family: var(--font-body); font-size: 14px; line-height: 1.75; color: #cfc8b8; }
.log .ln b { font-family: var(--font-ui); font-size: 11px; color: var(--text-dim); margin-right: 8px; letter-spacing: .1em; }
.log .ln.k b { color: var(--lamp); } .log .ln.s b { color: var(--chill); } .log .ln.m { color: #e1c48a; }

.toast { position: absolute; left: 50%; top: calc(56px + var(--sat)); transform: translateX(-50%); z-index: 45; background: rgba(232,226,210,.97); color: var(--ink); padding: 8px 14px; font-size: 13px; border-left: 4px solid var(--seal); box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(4px); }
.toast b { font-family: var(--font-display); }

.endcard { place-items: center; padding: 24px 16px; text-align: center; position: relative; overflow: hidden; }
.endcard .bg { position: absolute; inset: 0; }
.endcard .bg img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.32) saturate(.7) blur(1px); transform: scale(1.04); }
.endcard .inner { position: relative; }
.endcard .inner { display: grid; gap: 18px; justify-items: center; max-width: 640px; }
.endcard h2 { font-family: var(--font-display); font-weight: 800; color: var(--paper); font-size: clamp(30px, 5vw, 46px); letter-spacing: .2em; margin: 0; }
.endcard p { font-family: var(--font-body); color: #cfc8b8; line-height: 2; margin: 0; }
.endcard .stats { font-size: 12px; color: var(--text-dim); letter-spacing: .06em; line-height: 1.9; }

.sheet-close { display: none; }
#btnHand { display: none; }

/* reversal mode tweaks */
.app.rev .meters { border-color: #4a2a27; }
.app.rev .who .nm { color: #f2d9b0; }
.gmcall { background: #181e20; border: 1px solid #3a4649; border-left: 3px solid var(--chill); padding: 9px 12px; border-radius: var(--r); display: grid; gap: 2px; }
.gmcall .k { font-size: 10px; letter-spacing: .2em; color: var(--chill); }
.gmcall b { font-family: var(--font-display); color: var(--paper); font-size: 15px; letter-spacing: .04em; }
.gmcall span { font-size: 12px; color: var(--text-dim); }
.hand { display: flex; gap: 6px; flex-wrap: wrap; }
.hand .fc { width: 34px; height: 46px; border-radius: 2px; background: repeating-linear-gradient(45deg, #2a3436 0 4px, #222b2d 4px 8px); border: 1px solid #3f4b4e; }
.mini { display: grid; gap: 6px; }
.mini .it { background: #1b2224; border: 1px solid #2f3a3d; border-radius: var(--r); padding: 7px 10px; font-size: 12px; line-height: 1.6; display: grid; gap: 2px; }
.mini .it b { font-family: var(--font-display); font-size: 13px; color: var(--paper); }
.mini .it.bad { border-color: #6d2a25; }
.mini .it .st { font-size: 10px; letter-spacing: .1em; }
.mini .it .st.safe { color: var(--good); } .mini .it .st.out { color: #e0675c; }

/* ───────── narrow / portrait ───────── */
@media (max-width: 860px), (max-aspect-ratio: 1/1) {
  body { font-size: 13px; }
  .topbar { padding: 6px 12px; padding-top: calc(6px + var(--sat)); gap: 8px; min-height: 40px; }
  .topbar .case { display: none; }
  .topbar .chap { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 13px; letter-spacing: .06em; }
  .clock b { font-size: 17px; }
  .clock small { display: none; }
  #btnLog, #btnHelp, #btnSound { display: none; }
  .title-copy .en { display: none; }
  .menu .row .btn { min-width: 0; font-size: 14px; padding: 9px 12px; letter-spacing: .04em; }
  .chapter-card .pic .vt { font-size: clamp(24px, 7.5vw, 40px); white-space: nowrap; top: 14px; }
  .toast { font-size: 12px; white-space: nowrap; }
  .room {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto auto auto;
    grid-template-areas: "stage" "meters" "dialog" "cmd";
    gap: 8px; padding: 8px 12px; padding-bottom: calc(8px + var(--sab));
  }
  .meters { padding: 8px 10px; gap: 6px; }
  .who .nm { font-size: 15px; }
  .who .meta { display: none; }
  .gauge { gap: 2px; }
  .cap { height: 12px; }
  .conds { padding-top: 6px; }
  .dialogue { min-height: 96px; padding: 10px 12px 12px; }
  .dialogue .txt { font-size: 15px; line-height: 1.75; min-height: 3.4em; }
  .cmd { font-size: 14px; padding: 9px 2px 8px; letter-spacing: .06em; }
  .cmd small { display: none; }
  .responses { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .resp { font-size: 12px; padding: 9px 2px 7px; letter-spacing: 0; }
  .resp small { display: none; }
  .resp .l { display: none; }
  .resp .s { display: inline; }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-height: 78%; border-radius: 10px 10px 0 0;
    box-shadow: 0 -20px 60px rgba(0,0,0,.6); transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel.open { transform: translateY(0); }
  .sheet-close { display: inline-flex; }
  .app.rev #btnHand { display: inline-flex; color: var(--chill); border-color: rgba(147,182,194,.5); }
  .shakes { grid-template-columns: 1fr 1fr; }
  .chapter-card { grid-template-columns: minmax(0, 1fr); }
  .chapter-card .pic { min-height: 200px; }
  .chapter-card .pic::after { background: linear-gradient(180deg, transparent 50%, #0b0d0e); }
  .chapter-card .body { padding: 18px 16px 18px; }
  .title-inner { grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; }
  .menu .btn { min-width: 180px; }
  .help .two { grid-template-columns: 1fr; }
}
@media (max-width: 860px) and (min-aspect-ratio: 1/1) {
  .room { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0,1fr) auto; grid-template-areas: "stage meters" "stage dialog" "cmd cmd"; }
}
@media (prefers-reduced-motion: reduce) {
  .photo .drift, .title-bg img, .glare { animation: none !important; }
  .photo.shake { animation: none; }
  .photo .insert.on { transition: none; }
}

<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <span class="chap" id="chapLabel">完落ち</span>
    <span class="case" id="caseLabel"></span>
    <span class="clock" id="clock" hidden><b id="clockTime">13:00</b><small id="clockEnd"></small></span>
    <button class="iconbtn" id="btnHand" type="button" title="瀬名の手札と、あなたの嘘">手札</button>
    <button class="iconbtn" id="btnLog" type="button" title="会話の履歴">履歴</button>
    <button class="iconbtn" id="btnHelp" type="button" title="遊び方">？</button>
    <button class="iconbtn" id="btnSound" type="button" title="音のオン・オフ">音</button>
    <button class="iconbtn" id="btnMenu" type="button" title="タイトルへ">≡</button>
  </header>
  <main class="room" id="room">
    <section class="stage" id="stage" aria-label="取調室">
      <div class="stage-fill"><img id="fillImg" alt=""></div>
      <div class="photo" id="photo">
        <div class="drift" id="drift">
          <img class="shot" id="shotA" alt="">
          <img class="shot" id="shotB" alt="">
        </div>
        <img class="insert" id="insert" alt="">
        <div class="ev-tag" id="evTag"></div>
        <div class="grain" id="grain"></div>
        <div class="vignette"></div>
        <div class="flicker" id="flicker"></div>
        <div class="lampglow" id="lampglow"></div>
        <div class="glare" id="glare"></div>
        <div class="ncrail" id="ncrail" aria-hidden="true"></div>
        <div class="stamp" id="stamp" aria-hidden="true"></div>
        <div class="pov-label" id="povLabel">被疑者席</div>
        <div class="flash" id="flash"></div>
      </div>
    </section>
    <section class="meters" id="meters" aria-label="被疑者の状態"></section>
    <aside class="panel" id="panel" aria-label="捜査ファイル">
      <div class="panel-head"><h2 id="panelTitle">聴取メモ</h2><span class="sub" id="panelSub"></span><button class="iconbtn x sheet-close" id="panelClose" type="button">閉じる</button></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
    <section class="dialogue idle" id="dialogue" aria-live="polite" tabindex="0">
      <div class="spk" id="spk"></div>
      <p class="txt" id="txt"></p>
      <span class="nxt" aria-hidden="true">▼</span>
      <button class="skip" id="btnSkip" type="button" title="会話をまとめて送る（S）">≫ 送る</button>
    </section>
    <nav class="commands" id="commands" aria-label="コマンド">
      <button class="cmd" type="button" data-cmd="hear">聴き取り<small>言い分を聞く</small></button>
      <button class="cmd" type="button" data-cmd="facts">捜査事実<small>矛盾を突く</small></button>
      <button class="cmd" type="button" data-cmd="shake">揺さぶり<small>心を動かす</small></button>
      <button class="cmd" type="button" data-cmd="record">供述調書<small>記録を見る</small></button>
    </nav>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <div class="overlay solid" id="overlay"></div>
</div>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
